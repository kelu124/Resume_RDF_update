[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "resume-rdf"
version = "0.1.0"
description = "Parse CVs into Turtle RDF knowledge graphs using the Anthropic Claude API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
]

[project.optional-dependencies]
app       = ["streamlit>=1.35.0"]
validate  = ["rdflib>=6.0.0"]
reconcile = ["rdflib>=6.0.0"]
qa        = ["rdflib>=6.0.0"]
merge     = ["rdflib>=6.0.0"]
viz       = ["rdflib>=6.0.0", "pyvis>=0.3.2", "networkx>=3.0", "matplotlib>=3.5"]
export    = ["rdflib>=6.0.0"]
docx      = ["python-docx>=0.8.11"]
dataset   = ["datasets>=2.0.0", "huggingface_hub>=0.20.0"]
all       = ["resume-rdf[app,validate,dataset,reconcile,qa,merge,viz,export,docx]"]

[project.scripts]
cv-to-rdf    = "resume_rdf.cli:main"
cv-reconcile = "resume_rdf.reconcile:main"
cv-audit     = "resume_rdf.qa:audit_main"
cv-update    = "resume_rdf.qa:update_main"
cv-graph     = "resume_rdf.viz:main"
cv-to-md     = "resume_rdf.export:main"
cv-merge     = "resume_rdf.merge:main"

[project.urls]
Repository = "https://github.com/kelu124/Resume_RDF_update"

[tool.setuptools.packages.find]
where   = ["."]
include = ["resume_rdf*"]
